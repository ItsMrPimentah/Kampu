services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: showtime
      POSTGRES_PASSWORD: showtime
      POSTGRES_DB: showtime
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: showtime
      MINIO_ROOT_PASSWORD: showtime-secret
      MINIO_DEFAULT_BUCKETS: showtime
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/bitnami/minio/data

volumes:
  postgres_data:
  minio_data:
