name: showtime_mobile
description: Showtime football community mobile client.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_animate: ^4.5.0
  flutter_hooks: ^0.20.5
  flutter_riverpod: 2.6.1
  freezed_annotation: ^2.4.4
  hive_ce: ^2.7.0
  go_router: ^14.8.1
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  freezed: ^2.5.7
  patrol: ^3.13.0
  flutter_lints: ^5.0.0
  mocktail: 1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
